<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Imagem Dinâmica</h1>
    <p>Tente abrir este site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navagador.</p>
    <picture>
        <source media="(max-width:750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width:1050px )" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudio em HTML?</p>
    <audio preload="metadata" controls autoplay loop>
        <source src="midia/organic-apples-ashley-shadow.mp3" type="audio/mpeg">
        <source src="midia/organic-apples-ashley-shadow.ogg" type="audio/ogg">
        <source src="midia/organic-apples-ashley-shadow.wav" type="audio/wav">
        <p>Ifelizmente seu navegador não consegue reproduzir áudio</p><a href="midia/organic-apples-ashley-shadow.mp3">clique aqui para executar o download</a>
    </audio>
</body>
</html>
