<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de caixa</title>
    <style>
        h1 {  /*box-level*/
            background-color: lightgrey;

            width: 300px;
            height: 300px;


            border: 10px solid rgb(45, 71, 45);

            padding: 10px;

            margin: 20px auto 40px auto;

            outline: 5px dashed rgb(185, 48, 185);

        }


        a {     /*INLINE-LEVEL*/
            border: 10px solid red;

            padding: 5px;
        }
    </style>
</head>

<body>
    <h1>Exemplos de caixas box-level</h1>
    <p>Parágrafos também são exemplos de Box-level, mas os <a href="#">links são exemplos de caixa
            inline-level</a>.Vamos ver como tudo isso funciona?</p>
</body>

</html>
